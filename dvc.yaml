stages:
  preprocess:
    cmd: python -m src.data.preprocess --raw-dir data/raw --processed-dir data/processed
    deps:
      - data/raw
      - src/data/preprocess.py
    outs:
      - data/processed

  # Training is intentionally NOT a DVC pipeline stage: model versioning here
  # is handled by MLflow (params/metrics/artifacts per run - see mlruns/),
  # while DVC's job is strictly dataset versioning (raw + processed images),
  # per the assignment split of responsibilities. The final model.pt is
  # small enough to commit directly to git for grading convenience.
  # Run it with: python -m src.models.train --data-dir data/processed --output models/model.pt
